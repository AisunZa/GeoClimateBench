schema_version = "1.4"
artifacts = ["/app/solve.py", "/app/results/daily_max.nc"]

[task]
name = "geoclimatebench/daily-max-qc"
version = "1.0.0"
description = "Scientific hourly temperature QC and UTC daily maxima"
authors = []
keywords = ["earth-science", "temperature", "netcdf", "python", "scientific-evaluation"]

[metadata]
category = "scientific-computing"
difficulty = "medium"

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 1200.0
os = "linux"
cpus = 2
memory_mb = 2048
storage_mb = 4096

[agent]
timeout_sec = 900.0

[environment]
network_mode = "no-network"
build_timeout_sec = 1200.0
os = "linux"
cpus = 2
memory_mb = 2048
storage_mb = 4096
